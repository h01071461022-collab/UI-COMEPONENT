js:`// Esc로 열려 있는 툴팁 숨기기 (포커스는 그대로)
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.tt').forEach(function (t) {
    if (t.matches(':hover') || t.matches(':focus-within')) t.classList.add('dismissed');
  });
});

// 다시 hover/focus 하면 툴팁 복구
document.querySelectorAll('.tt').forEach(function (t) {
  ['mouseleave', 'focusout'].forEach(function (ev) {
    t.addEventListener(ev, function () { t.classList.remove('dismissed'); });
  });
});`});

css:`.tgl { width: min(100%, 420px); }
.tgl h3 { margin: 0 0 6px; font-size: 17px; }

/* 스위치 */

.sw:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 3px; }

js:`document.querySelectorAll('.sw').forEach(function (sw) {
  sw.addEventListener('click', function () {

var CATS = {
  input: '입력',
  nav:   '내비게이션',
  info:  '정보 전달',
  box:   '컨테이너'
};
var CAT_ORDER = ['input', 'nav', 'info', 'box'];

var RESET_CSS = "*,*::before,*::after{box-sizing:border-box}html,body{height:100%}" +
  "body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;" +
  "padding:28px 20px;font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;" +
  "font-size:15px;line-height:1.55;color:#111312;background:#fff;-webkit-font-smoothing:antialiased}" +
  "button,input,textarea,select{font-family:inherit}";

var state = { id: null, lang: 'html', mobile: false, cat: 'all', q: '' };

function buildPreviewDoc(item) {
  return '<!doctype html><html lang="ko"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<style>' + RESET_CSS + '\n' + item.css + '</style></head><body>' +
    item.html + '<scr' + 'ipt>\ntry{\n' + item.js + '\n}catch(e){document.body.insertAdjacentHTML("beforeend","<pre style=\\"position:fixed;left:12px;right:12px;bottom:12px;padding:10px;background:#fff1f0;border:1px solid #d42a1f;border-radius:8px;font-size:12px;color:#8a1810;white-space:pre-wrap\\">"+e+"</pre>")}\n</scr' + 'ipt>' +
    '</body></html>';
}

/* ---------- 좌측 색인 ---------- */
var listEl = document.getElementById('list');
var catsEl = document.getElementById('cats');

function renderCatFilters() {
  catsEl.innerHTML = '';
  var allBtn = document.createElement('button');
  allBtn.type = 'button'; allBtn.textContent = '전체'; allBtn.dataset.cat = 'all';
  catsEl.appendChild(allBtn);
  CAT_ORDER.forEach(function (c) {
    var n = ITEMS.filter(function (it) { return it.cat === c; }).length;
    var b = document.createElement('button');
    b.type = 'button'; b.dataset.cat = c;
    b.innerHTML = CATS[c] + '<b>' + n + '</b>';
    catsEl.appendChild(b);
  });
  catsEl.querySelectorAll('button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.cat === state.cat));
    b.addEventListener('click', function () { state.cat = b.dataset.cat; renderCatFilters(); renderList(); });
  });
}

function renderList() {
  var q = state.q.trim().toLowerCase();
  var filtered = ITEMS.filter(function (it) {
    if (state.cat !== 'all' && it.cat !== state.cat) return false;
    if (!q) return true;
    return it.en.toLowerCase().indexOf(q) > -1 || it.ko.indexOf(q) > -1;
  });

  listEl.innerHTML = '';
  if (!filtered.length) {
    var empty = document.createElement('li');
    empty.className = 'list-empty';
    empty.textContent = '일치하는 엘리먼트가 없습니다.';
    listEl.appendChild(empty);
    return;
  }

  filtered.forEach(function (it) {
    var idx = ITEMS.indexOf(it);
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + it.id;
    a.dataset.id = it.id;
    a.innerHTML = '<span class="n">' + String(idx + 1).padStart(2, '0') + '</span>' +
      '<span><span class="en">' + it.en + '</span><span class="ko">' + it.ko + '</span></span>' +
      '<span class="c">' + CATS[it.cat] + '</span>';
    a.addEventListener('click', function (e) { e.preventDefault(); select(it.id); closeMobileIndex(); });
    li.appendChild(a);
    listEl.appendChild(li);
  });
  markCurrent();
}

function markCurrent() {
  listEl.querySelectorAll('a').forEach(function (a) {
    a.toggleAttribute('aria-current', a.dataset.id === state.id);
    if (a.dataset.id === state.id) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
}

document.getElementById('find').addEventListener('input', function (e) {
  state.q = e.target.value; renderList();
});

/* ---------- 메인 스펙 시트 ---------- */
var elNo = document.getElementById('s-no');
var elCat = document.getElementById('s-cat');
var elCatDesc = document.getElementById('s-catdesc');
var elTitle = document.getElementById('s-title');
var elDesc = document.getElementById('s-desc');
var elA11y = document.getElementById('s-a11y');
var frame = document.getElementById('frame');
var codeInner = document.getElementById('code-inner');
var stage = document.getElementById('stage');

var CAT_DESC = {
  input: '사용자가 값을 입력하거나 고르는 요소',
  nav:   '다른 화면이나 위치로 이동을 돕는 요소',
  info:  '상태나 정보를 사용자에게 전달하는 요소',
  box:   '관련된 콘텐츠를 담아 두는 요소'
};

function select(id) {
  var item = ITEMS.find(function (it) { return it.id === id; });
  if (!item) return;
  var idx = ITEMS.indexOf(item);
  state.id = id;

  elNo.textContent = String(idx + 1).padStart(2, '0');
  elCat.textContent = CATS[item.cat];
  elCatDesc.textContent = CAT_DESC[item.cat];
  elTitle.innerHTML = item.en + '<small>' + item.ko + '</small>';
  elDesc.textContent = item.desc;
  elA11y.textContent = item.a11y;

  frame.srcdoc = buildPreviewDoc(item);
  renderTabs(item);
  renderPager(idx);
  markCurrent();
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  document.getElementById('main').scrollTo({ top: 0 });
}

/* ---------- 미리보기 너비 ---------- */
document.getElementById('vw-full').addEventListener('click', function () { setWidth(false); });
document.getElementById('vw-mobile').addEventListener('click', function () { setWidth(true); });
function setWidth(mobile) {
  state.mobile = mobile;
  stage.classList.toggle('is-mobile', mobile);
  document.getElementById('vw-full').setAttribute('aria-pressed', String(!mobile));
  document.getElementById('vw-mobile').setAttribute('aria-pressed', String(mobile));
}
document.getElementById('rerun').addEventListener('click', function () {
  var item = ITEMS.find(function (it) { return it.id === state.id; });
  frame.srcdoc = buildPreviewDoc(item);
});

/* ---------- 소스 탭 ---------- */
var LANG_CLASS = { html: 'language-xml', css: 'language-css', js: 'language-javascript' };
function renderTabs(item) {
  ['html', 'css', 'js'].forEach(function (lang) {
    var small = document.getElementById('tab-' + lang).querySelector('small');
    var lines = item[lang].split('\n').length;
    small.textContent = lines + '줄';
  });
  if (!['html', 'css', 'js'].includes(state.lang)) state.lang = 'html';
  showCode(item, state.lang);
}
function showCode(item, lang) {
  state.lang = lang;
  ['html', 'css', 'js'].forEach(function (l) {
    document.getElementById('tab-' + l).setAttribute('aria-selected', String(l === lang));
  });
  codeInner.className = LANG_CLASS[lang];
  codeInner.textContent = item[lang];
  if (window.hljs) window.hljs.highlightElement(codeInner);
}
['html', 'css', 'js'].forEach(function (lang) {
  document.getElementById('tab-' + lang).addEventListener('click', function () {
    var item = ITEMS.find(function (it) { return it.id === state.id; });
    showCode(item, lang);
  });
});

/* ---------- 코드 복사 ---------- */
var toast = document.getElementById('toast');
var toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
}
document.getElementById('copy').addEventListener('click', function () {
  var text = codeInner.textContent;
  function done() { showToast(state.lang.toUpperCase() + ' 코드를 복사했습니다.'); }
  function fail() {
    var r = document.createRange();
    r.selectNodeContents(codeInner);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
    showToast('복사 권한이 없어 코드를 선택해 두었습니다. Ctrl/Cmd+C를 눌러 주세요.');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fail);
  } else fail();
});

/* ---------- 이전/다음 ---------- */
var prevA = document.getElementById('prev');
var nextA = document.getElementById('next');
function renderPager(idx) {
  var prevItem = ITEMS[idx - 1];
  var nextItem = ITEMS[idx + 1];
  prevA.hidden = !prevItem;
  nextA.hidden = !nextItem;
  if (prevItem) { prevA.querySelector('b').textContent = prevItem.en; prevA.onclick = function (e) { e.preventDefault(); select(prevItem.id); }; }
  if (nextItem) { nextA.querySelector('b').textContent = nextItem.en; nextA.onclick = function (e) { e.preventDefault(); select(nextItem.id); }; }
}

/* ---------- 모바일 색인 서랍 ---------- */
var indexEl = document.getElementById('index');
var openBtn = document.getElementById('open-index');
function closeMobileIndex() { indexEl.classList.remove('open'); openBtn.setAttribute('aria-expanded', 'false'); }
openBtn.addEventListener('click', function () {
  var open = !indexEl.classList.contains('open');
  indexEl.classList.toggle('open', open);
  openBtn.setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', function (e) {
  if (window.innerWidth > 900) return;
  if (indexEl.classList.contains('open') && !indexEl.contains(e.target) && e.target !== openBtn && !openBtn.contains(e.target)) closeMobileIndex();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMobileIndex(); });

/* ---------- 시작 ---------- */
renderCatFilters();
renderList();
var startId = (location.hash || '').replace('#', '');
select(ITEMS.some(function (it) { return it.id === startId; }) ? startId : ITEMS[0].id);
</script>
