<title>UI 엘리먼트 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: specimen catalogue — fixed index column on the left, one numbered spec sheet per element on the right (light only, by request) */
:root{
  --paper:#F3F4F1;
  --sheet:#FFFFFF;
  --ink:#0E100F;
  --ink-2:#363B37;
  --ink-3:#62685F;
  --line:#D3D6CF;
  --line-2:#E5E7E1;
  --marker:#FFE14D;
  --signal:#1F3FD1;
  --f-display:'Archivo','Arial Narrow',Arial,sans-serif;
  --f-body:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --side:304px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}

/* index column */
.index{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--sheet);border-right:1px solid var(--line)}
.index-head{padding:22px 20px 14px;border-bottom:1px solid var(--line)}
.index-kicker{margin:0;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.index-title{margin:6px 0 4px;font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:25px;line-height:1.05;letter-spacing:-.01em}
.index-title span{display:block;font-family:var(--f-body);font-stretch:100%;font-weight:600;font-size:15px;letter-spacing:0;margin-top:4px}
.index-src{margin:0;font-size:12px;color:var(--ink-3)}
.index-src a{color:var(--ink-2);text-underline-offset:2px}
.index-tools{display:grid;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.find{position:relative}
.find svg{position:absolute;left:10px;top:50%;width:16px;height:16px;transform:translateY(-50%);fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.find input{width:100%;height:36px;padding:0 10px 0 34px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font:inherit;font-size:14px;color:var(--ink)}
.find input:focus{outline:none;border-color:var(--ink);background:var(--sheet)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer}
.cats button:hover{border-color:var(--ink)}
.cats button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.cats b{font-family:var(--f-mono);font-weight:500;font-size:11px;margin-left:4px;opacity:.7}
.list{flex:1;overflow-y:auto;margin:0;padding:8px 10px 24px;list-style:none;overscroll-behavior:contain}
.list a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:baseline;gap:8px;padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--ink)}
.list a:hover{background:var(--paper)}
.list a[aria-current="page"]{background:var(--marker)}
.list .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.list a[aria-current="page"] .n{color:var(--ink)}
.list .en{font-family:var(--f-display);font-stretch:108%;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .ko{display:block;font-family:var(--f-body);font-stretch:100%;font-weight:400;font-size:12px;color:var(--ink-3)}
.list a[aria-current="page"] .ko{color:var(--ink-2)}
.list .c{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-3)}
.list-empty{padding:16px 10px;font-size:13px;color:var(--ink-3)}

/* main sheet */
.main{min-width:0;padding:32px clamp(16px,4vw,56px) 64px;display:grid;gap:28px;align-content:start;max-width:1180px}
.mobile-bar{display:none}
.sheet-head{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:28px;row-gap:6px;align-items:end;padding-bottom:22px;border-bottom:2px solid var(--ink)}
.sheet-no{grid-row:span 2;font-family:var(--f-mono);font-weight:500;font-size:clamp(44px,7vw,84px);line-height:.9;letter-spacing:-.04em;color:var(--ink);font-variant-numeric:tabular-nums}
.sheet-tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sheet-tags .cat{padding:2px 8px;border:1px solid var(--ink);border-radius:3px;color:var(--ink)}
.sheet-title{margin:0;font-family:var(--f-display);font-stretch:122%;font-weight:850;font-size:clamp(34px,5.4vw,64px);line-height:.95;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.sheet-title small{font-family:var(--f-body);font-stretch:100%;font-weight:500;font-size:.38em;letter-spacing:0;margin-left:.5em;color:var(--ink-2);white-space:nowrap}
.sheet-body{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px}
.sheet-desc{margin:0;font-size:16px;line-height:1.7;max-width:62ch}
.sheet-a11y{margin:0;padding:12px 14px;border:1px dashed var(--line);border-radius:6px;font-size:13.5px;color:var(--ink-2);align-self:start}
.sheet-a11y b{display:block;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:2px}

/* stage */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.panel-label{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.panel-label span{font-weight:400;color:var(--ink-3);letter-spacing:.04em;text-transform:none;margin-left:8px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{height:30px;padding:0 10px;border:0;background:var(--sheet);font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tool-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer}
.tool-btn:hover,.seg button:not([aria-pressed="true"]):hover{background:var(--paper);color:var(--ink)}
.tool-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;display:flex;justify-content:center;padding:18px;background-color:var(--paper);background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:16px 16px}
.stage iframe{display:block;width:100%;border:1px solid var(--line-2);border-radius:6px;background:#fff;transition:width .25s ease}
.stage.is-mobile iframe{width:390px;max-width:100%}

/* source */
.tabs{display:flex;gap:2px}
.tabs button{position:relative;height:34px;padding:0 14px;border:0;border-radius:6px 6px 0 0;background:transparent;font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--ink-3);cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-11px;height:3px;background:var(--ink)}
.tabs small{font-weight:400;font-size:11px;color:var(--ink-3);margin-left:6px}
.code{margin:0;max-height:520px;overflow:auto;padding:18px 20px;background:#FBFBF9;font-family:var(--f-mono);font-size:13px;line-height:1.65;tab-size:2;color:var(--ink)}
.code code{white-space:pre}
.code-note{margin:0;padding:10px 16px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-3)}
.code-note code{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.hljs-tag,.hljs-name,.hljs-selector-tag,.hljs-selector-class,.hljs-selector-id,.hljs-selector-pseudo,.hljs-selector-attr{color:#9A1B57}
.hljs-attr,.hljs-property{color:#7A4E00}
.hljs-string,.hljs-regexp{color:#0D6638}
.hljs-keyword,.hljs-built_in,.hljs-literal,.hljs-attribute,.hljs-meta{color:#1F3FD1}
.hljs-number{color:#A93C0A}
.hljs-comment{color:#6A706B;font-style:italic}
.hljs-title,.hljs-title.function_,.hljs-title.class_{color:var(--ink);font-weight:600}
.hljs-params,.hljs-variable,.hljs-punctuation{color:var(--ink-2)}

/* pager */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a{display:grid;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);text-decoration:none}
.pager a:hover{border-color:var(--ink)}
.pager a.next{text-align:right}
.pager small{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.pager b{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:17px}
.pager a[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);padding:9px 16px;border-radius:6px;background:var(--ink);color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- narrow ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .mobile-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-32px calc(-1 * clamp(16px,4vw,56px)) 0;padding:10px 16px;background:var(--sheet);border-bottom:1px solid var(--line)}
  .mobile-bar b{font-family:var(--f-display);font-stretch:115%;font-weight:800;font-size:17px}
  .index{position:fixed;inset:0 auto 0 0;width:min(86vw,340px);height:100%;z-index:40;transform:translateX(-102%);transition:transform .25s ease;box-shadow:none}
  .index.open{transform:none;box-shadow:0 0 0 100vmax rgba(14,16,15,.35)}
  .sheet-body{grid-template-columns:minmax(0,1fr)}
  .sheet-head{grid-template-columns:minmax(0,1fr)}
  .sheet-no{grid-row:auto;font-size:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
var ITEMS = [];
function E(o){ ITEMS.push(o); }

/* ---------------- 01 Accordion ---------------- */
E({id:'accordion', en:'Accordion', ko:'아코디언', cat:'box', h:380,
desc:'제목을 눌러 내용을 펼치고 접는 컨테이너입니다. 긴 FAQ나 설정 항목처럼 많은 정보를 좁은 공간에 담아야 할 때, 사용자가 필요한 부분만 골라 읽을 수 있게 해 줍니다.',
a11y:'제목은 실제 button으로 만들고 aria-expanded로 열림 상태를 알립니다. 패널은 role="region"과 aria-labelledby로 제목과 연결합니다. 높이 애니메이션은 grid-template-rows 0fr→1fr 전환을 씁니다.',
html:`<div class="acc">
  <div class="acc-item open">
    <h3><button class="acc-trigger" id="acc-t1" aria-expanded="true" aria-controls="acc-p1">
      배송은 얼마나 걸리나요?<span class="acc-icon" aria-hidden="true"></span>
    </button></h3>
    <div class="acc-panel" id="acc-p1" role="region" aria-labelledby="acc-t1">
      <div class="acc-inner"><p>결제 후 영업일 기준 2–3일 안에 도착합니다. 제주와 도서산간 지역은 하루가 더 걸릴 수 있습니다.</p></div>
    </div>
  </div>
  <div class="acc-item">
    <h3><button class="acc-trigger" id="acc-t2" aria-expanded="false" aria-controls="acc-p2">
      반품은 언제까지 신청할 수 있나요?<span class="acc-icon" aria-hidden="true"></span>
    </button></h3>
    <div class="acc-panel" id="acc-p2" role="region" aria-labelledby="acc-t2">
      <div class="acc-inner"><p>상품을 받은 날로부터 14일 안에 주문 내역에서 신청하세요. 포장을 뜯지 않은 상품은 반품 배송비가 없습니다.</p></div>
    </div>
  </div>
  <div class="acc-item">
    <h3><button class="acc-trigger" id="acc-t3" aria-expanded="false" aria-controls="acc-p3">
      사이즈 교환도 가능한가요?<span class="acc-icon" aria-hidden="true"></span>
    </button></h3>
    <div class="acc-panel" id="acc-p3" role="region" aria-labelledby="acc-t3">
      <div class="acc-inner"><p>같은 상품의 다른 사이즈로 한 번 무료 교환해 드립니다. 재고가 없으면 환불로 처리됩니다.</p></div>
    </div>
  </div>
</div>`,
css:`.acc {
  width: min(100%, 460px);
  border-top: 2px solid #111312;
}
.acc-item { border-bottom: 1px solid #d4d7d1; }
.acc h3 { margin: 0; }

.acc-trigger {
  all: unset;
  box-sizing: border-box;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 18px 4px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.acc-trigger:hover { color: #1f3fd1; }
.acc-trigger:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 2px; }

/* + / − 아이콘 */
.acc-icon { position: relative; flex: none; width: 14px; height: 14px; }
.acc-icon::before,
.acc-icon::after {
  content: "";
  position: absolute;
  left: 0; top: 6px;
  width: 14px; height: 2px;
  background: currentColor;
  transition: transform .25s ease;
}
.acc-icon::after { transform: rotate(90deg); }
.acc-item.open .acc-icon::after { transform: rotate(0); }

/* 높이 0 → auto 애니메이션 */
.acc-panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .3s ease;
}
.acc-item.open .acc-panel { grid-template-rows: 1fr; }
.acc-inner { overflow: hidden; }
.acc-inner p { margin: 0; padding: 0 4px 18px; color: #4a4f4b; }`,
js:`document.querySelectorAll('.acc-trigger').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var item = btn.closest('.acc-item');
    var isOpen = item.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(isOpen));
  });
});`});

/* ---------------- 02 Bento Menu ---------------- */
E({id:'bento-menu', en:'Bento Menu', ko:'벤토 메뉴', cat:'nav', h:380,
desc:'도시락(벤토) 칸처럼 3×3 격자 점으로 그린 메뉴 아이콘입니다. 누르면 여러 앱이나 서비스로 이동하는 바로가기가 격자 형태로 펼쳐집니다.',
a11y:'아이콘만 있는 버튼이므로 aria-label로 이름을 붙입니다. aria-expanded로 열림 상태를 알리고, Esc를 누르면 닫힌 뒤 버튼으로 포커스가 돌아갑니다.',
html:`<div class="bento">
  <button class="bento-btn" type="button" aria-label="앱 전체 보기"

css:`body { align-items: flex-start; padding-top: 40px; }

.bento { position: relative; }

.bento-btn {
  display: grid;
  grid-template-columns: repeat(3, 5px);
  gap: 4px;
  padding: 12px;
  border: 1px solid #d4d7d1;
  border-radius: 10px;
  background: #fff;
  cursor: pointer;
}
.bento-btn span { width: 5px; height: 5px; border-radius: 1px; background: #111312; }
.bento-btn:hover,
.bento-btn[aria-expanded="true"] { background: #f1f2ef; }
.bento-btn:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 2px; }

.bento-pop {
  position: absolute;
  top: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  width: 252px;
  padding: 14px;
  background: #fff;
  border: 1px solid #d4d7d1;
  border-radius: 12px;
  box-shadow: 0 12px 32px rgba(17, 19, 18, .12);
}
.bento-title {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .06em;
  color: #4a4f4b;
}
.bento-pop ul {
  list-style: none;
  margin: 0; padding: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
}
.bento-pop a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 4px;
  border-radius: 8px;
  font-size: 13px;
  color: #111312;
  text-decoration: none;
}
.bento-pop a:hover,
.bento-pop a:focus-visible { background: #f1f2ef; outline: none; }
.bento-pop b {
  display: grid;
  place-items: center;
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--c);
  color: #fff;
  font-size: 14px;
}`,
js:`var btn = document.querySelector('.bento-btn');
var pop = document.getElementById('bento-pop');

function setOpen(open) {
  pop.hidden = !open;
  btn.setAttribute('aria-expanded', String(open));
}

btn.addEventListener('click', function (e) {
  e.stopPropagation();
  setOpen(pop.hidden);
});

// 바깥을 누르면 닫기
document.addEventListener('click', function (e) {
  if (!pop.contains(e.target)) setOpen(false);
});

// Esc로 닫고 버튼으로 포커스 복귀
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !pop.hidden) {
    setOpen(false);
    btn.focus();
  }
});`});

E({id:'breadcrumb', en:'Breadcrumb', ko:'브레드크럼', cat:'nav', h:340,
desc:'사이트 안에서 현재 위치와 거쳐 온 상위 단계를 보여 주는 경로 링크입니다. 보통 페이지 위쪽에 두며, 각 단계를 눌러 바로 그 단계로 이동할 수 있습니다.',
a11y:'nav에 aria-label을 붙이고 순서가 있는 ol로 구성합니다. 마지막 항목은 현재 페이지이므로 링크로 만들지 않고 aria-current="page"를 줍니다. 구분자 "/"는 CSS로 그려 스크린리더가 읽지 않습니다.',
html:`<div class="crumb-demo">
  <nav class="crumbs" aria-label="현재 위치">
    <ol id="crumb-list">
      <li><a href="#">홈</a></li>

  <div class="crumb-page">
    <h2 id="crumb-title">메시 체어 M2</h2>
    <p>경로의 상위 단계를 누르면 그 페이지로 이동한 것처럼 바뀝니다.</p>
  </div>

  <button type="button" class="crumb-reset" id="crumb-reset">처음 경로로 되돌리기</button>

css:`.crumb-demo { display: grid; gap: 20px; width: min(100%, 520px); }

.crumbs ol {
  list-style: none;
  margin: 0; padding: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  font-size: 14px;
}
.crumbs li { display: flex; align-items: center; gap: 4px; }
.crumbs li + li::before { content: "/"; color: #9aa09b; padding: 0 2px; }

.crumbs a {
  padding: 2px 4px;
  border-radius: 4px;
  color: #4a4f4b;
  text-decoration: none;
}
.crumbs a:hover { color: #111312; background: #f1f2ef; text-decoration: underline; }
.crumbs a:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 1px; }
.crumbs [aria-current="page"] { padding: 2px 4px; font-weight: 600; color: #111312; }

.crumb-page { padding: 20px; border: 1px solid #d4d7d1; border-radius: 10px; }
.crumb-page h2 { margin: 0 0 4px; font-size: 20px; }
.crumb-page p { margin: 0; font-size: 14px; color: #4a4f4b; }

.crumb-reset {
  justify-self: start;
  padding: 6px 12px;
  border: 1px solid #d4d7d1;
  border-radius: 6px;
  background: #fff;
  font-size: 13px;
  cursor: pointer;
}
.crumb-reset:hover { border-color: #111312; }`,
js:`var list = document.getElementById('crumb-list');
var title = document.getElementById('crumb-title');
var original = list.innerHTML;

function bind() {
  list.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var li = a.parentElement;
      // 클릭한 단계 뒤의 경로를 지우고 현재 페이지로 표시
      while (li.nextElementSibling) li.nextElementSibling.remove();
      var current = document.createElement('span');
      current.setAttribute('aria-current', 'page');
      current.textContent = a.textContent;
      li.replaceChildren(current);
      title.textContent = a.textContent;
    });
  });
}
bind();

document.getElementById('crumb-reset').addEventListener('click', function () {
  list.innerHTML = original;
  title.textContent = '메시 체어 M2';
  bind();
});`});

E({id:'button', en:'Button', ko:'버튼', cat:'input', h:300,

html:`<div class="btn-row">

css:`.btn-row {

}
.btn {
  display: inline-flex;

.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 3px; }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.btn-primary { background: #111312; color: #fff; }
.btn-primary:hover { background: #2e322f; }

.btn-secondary { background: #fff; border-color: #111312; color: #111312; }

  color: #1f3fd1;

}
.btn-ghost:hover { background: #eef1fd; }

.btn-danger { background: #d42a1f; color: #fff; }

/* 처리 중 스피너 */

.btn-caption { width: 100%; margin: 4px 0 0; text-align: center; font-size: 13px; color: #4a4f4b; }`,
js:`var pay = document.getElementById('pay');

pay.addEventListener('click', function () {
  if (pay.getAttribute('aria-busy') === 'true') return;

  pay.setAttribute('aria-busy', 'true');
  pay.innerHTML = '<span class="spin" aria-hidden="true"></span>처리 중';

  setTimeout(function () {
    pay.textContent = '결제 완료';
    setTimeout(function () {
      pay.textContent = '결제하기';
      pay.removeAttribute('aria-busy');

css:`.car { width: min(100%, 460px); }
.car-view { overflow: hidden; border-radius: 12px; }
.car-track {
  display: flex;
  margin: 0; padding: 0;
  list-style: none;
  transition: transform .45s cubic-bezier(.3, .7, .2, 1);
}
.car-slide {
  flex: 0 0 100%;

  flex-direction: column;
  justify-content: flex-end;
  min-height: 220px;
  padding: 24px;
}
.car-slide h3 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
.car-slide p { margin: 4px 0 0; font-size: 14px; opacity: .85; }
.car-no { margin-bottom: auto; font: 600 13px/1 ui-monospace, Menlo, monospace; }
.s1 { background: #ffe14d; color: #111312; }
.s2 { background: #1f3fd1; color: #fff; }
.s3 { background: #e7e9e3; color: #111312; }
.s4 { background: #111312; color: #fff; }

.car-ctrl { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.car-arrow {
  display: grid;
  place-items: center;
  width: 40px; height: 40px;
  border: 1px solid #d4d7d1;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
}
.car-arrow:hover { border-color: #111312; }
.car-arrow svg { width: 18px; height: 18px; fill: none; stroke: #111312; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.car-dots { display: flex; gap: 8px; }
.car-dots button {
  width: 8px; height: 8px;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: #c9ccc6;
  cursor: pointer;
  transition: width .25s, background .25s;
}
.car-dots button[aria-current="true"] { width: 24px; background: #111312; }
.car button:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 2px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }`,
js:`var track = document.querySelector('.car-track');
var count = track.children.length;
var dots = document.querySelector('.car-dots');
var status = document.querySelector('.car-status');
var index = 0;

for (var k = 0; k < count; k++) {
  (function (k) {
    var dot = document.createElement('button');
    dot.type = 'button';
    dot.setAttribute('aria-label', (k + 1) + '번 슬라이드로 이동');
    dot.addEventListener('click', function () { go(k); });
    dots.appendChild(dot);
  })(k);
}

function go(k) {
  index = (k + count) % count;   // 처음 ↔ 마지막 순환
  track.style.transform = 'translateX(' + (-100 * index) + '%)';
  Array.prototype.forEach.call(dots.children, function (d, j) {
    d.setAttribute('aria-current', j === index ? 'true' : 'false');
  });
  status.textContent = count + '개 중 ' + (index + 1) + '번째 슬라이드';
}

document.querySelector('.car-prev').addEventListener('click', function () { go(index - 1); });
document.querySelector('.car-next').addEventListener('click', function () { go(index + 1); });
go(0);`});

E({id:'checkbox', en:'Checkbox', ko:'체크박스', cat:'input', h:380,
desc:'사용자가 체크하거나 해제할 수 있는 작은 사각형입니다. 각 항목이 독립적으로 동작하므로 목록에서 여러 개를 함께 고를 수 있습니다. 폼과 설정 화면에서 흔히 씁니다.',
a11y:'네이티브 input[type=checkbox]를 appearance:none으로 다시 그려 키보드·스크린리더 동작을 그대로 유지합니다. 그룹 이름은 fieldset과 legend로 주고, 전체 선택은 일부만 선택됐을 때 indeterminate 상태가 됩니다.',
html:`<fieldset class="cb">
  <legend>알림 받을 채널</legend>

  <label class="cb-all">
    <input type="checkbox" id="cb-all">
    <span>전체 선택</span>
  </label>

  <div class="cb-list">
    <label><input type="checkbox" class="cb-opt" checked>
      <span>이메일<small>주 1회 요약</small></span></label>
    <label><input type="checkbox" class="cb-opt">
      <span>문자 메시지<small>배송 상태만</small></span></label>
    <label><input type="checkbox" class="cb-opt" checked>
      <span>앱 푸시<small>실시간</small></span></label>
  </div>

  <p class="cb-count" aria-live="polite"></p>
</fieldset>`,
css:`.cb { width: min(100%, 340px); margin: 0; padding: 0; border: 0; }
.cb legend { margin-bottom: 8px; font-size: 17px; font-weight: 700; }

.cb label {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 0;
  cursor: pointer;
}
.cb-all { border-bottom: 1px solid #d4d7d1; font-weight: 600; }
.cb-list span { display: flex; flex-direction: column; }
.cb small { font-size: 13px; color: #6b706c; }

/* 커스텀 체크박스 */
.cb input {
  appearance: none;
  flex: none;
  display: grid;
  place-content: center;
  width: 20px; height: 20px;
  margin: 2px 0 0;
  background: #fff;
  border: 1.5px solid #111312;
  border-radius: 4px;
  cursor: pointer;
}
.cb input::before {
  content: "";
  width: 11px; height: 6px;
  border: solid #fff;
  border-width: 0 0 2px 2px;
  transform: rotate(-45deg) translate(1px, -1px);
  opacity: 0;
}
.cb input:checked,
.cb input:indeterminate { background: #111312; }
.cb input:checked::before { opacity: 1; }
.cb input:indeterminate::before {
  opacity: 1;
  width: 10px; height: 0;
  border-width: 0 0 2px 0;
  transform: none;
}
.cb input:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 2px; }

.cb-count { margin: 8px 0 0; font-size: 13px; color: #4a4f4b; }`,
js:`var all = document.getElementById('cb-all');
var opts = Array.prototype.slice.call(document.querySelectorAll('.cb-opt'));
var count = document.querySelector('.cb-count');

function sync() {
  var n = opts.filter(function (o) { return o.checked; }).length;
  all.checked = n === opts.length;
  all.indeterminate = n > 0 && n < opts.length;  // 일부만 선택
  count.textContent = opts.length + '개 중 ' + n + '개 선택됨';
}

all.addEventListener('change', function () {
  opts.forEach(function (o) { o.checked = all.checked; });
  sync();
});
opts.forEach(function (o) { o.addEventListener('change', sync); });
sync();`});

E({id:'comment', en:'Comment', ko:'댓글', cat:'info', h:480,
desc:'사용자가 입력한 글을 시간 순서대로 보여 주는 영역입니다. 소셜 미디어나 블로그 글 아래에서 흔히 볼 수 있으며, 글 목록과 새 글 입력 폼이 함께 놓입니다.',
a11y:'입력창에는 화면에 보이지 않더라도 label을 연결합니다. 좋아요 버튼은 aria-pressed로 상태를 전달하고, 사용자가 입력한 글은 innerHTML이 아닌 textContent로 넣어 스크립트 삽입을 막습니다.',
html:`<section class="cmt">
  <h3>댓글 <span id="cmt-n">2</span></h3>

  <ul class="cmt-list" id="cmt-list">
    <li class="cmt-item">
      <span class="av" style="background:#ffe14d">지</span>
      <div class="cmt-body">
        <p class="cmt-meta"><b>지원</b><time>3시간 전</time></p>
        <p class="cmt-text">오류 메시지 예시가 특히 도움이 됐어요. 저희 팀 가이드에도 옮겨 두겠습니다.</p>
        <button class="like" type="button" aria-pressed="false">좋아요 <span>4</span></button>
      </div>
    </li>
    <li class="cmt-item">
      <span class="av" style="background:#dfe5fb">민</span>
      <div class="cmt-body">
        <p class="cmt-meta"><b>민호</b><time>1시간 전</time></p>
        <p class="cmt-text">두 번째 원칙은 모바일 앱에서도 그대로 적용되나요?</p>

  <form class="cmt-form" id="cmt-form">
    <label for="cmt-input" class="sr">댓글 쓰기</label>

    <button type="submit">등록</button>

css:`body { align-items: flex-start; }
.cmt { width: min(100%, 480px); }
.cmt h3 { margin: 0 0 8px; font-size: 17px; }
.cmt h3 span { color: #6b706c; font-weight: 500; }

.cmt-list { margin: 0; padding: 0; list-style: none; }
.cmt-item {
  display: flex;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid #e3e5e0;
}
.av {
  flex: none;
  display: grid;
  place-items: center;
  width: 36px; height: 36px;
  border-radius: 50%;
  font-size: 14px;
  font-weight: 700;
}
.cmt-body { min-width: 0; }
.cmt-meta { display: flex; gap: 8px; align-items: baseline; margin: 0; font-size: 14px; }
.cmt-meta time { font-size: 12px; color: #6b706c; }
.cmt-text { margin: 2px 0 6px; font-size: 14.5px; overflow-wrap: anywhere; }

.like {
  padding: 2px 8px;
  border: 1px solid #d4d7d1;
  border-radius: 999px;
  background: #fff;
  font-size: 12px;
  cursor: pointer;
}
.like[aria-pressed="true"] { background: #111312; border-color: #111312; color: #fff; }

.cmt-form { display: flex; gap: 8px; margin-top: 14px; }
.cmt-form textarea {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid #c9ccc6;
  border-radius: 8px;
  resize: vertical;
}
.cmt-form textarea:focus { outline: 2px solid #1f3fd1; outline-offset: -1px; border-color: transparent; }
.cmt-form button {
  align-self: stretch;
  padding: 0 18px;
  border: 0;
  border-radius: 8px;
  background: #111312;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }`,
js:`var list = document.getElementById('cmt-list');
var form = document.getElementById('cmt-form');
var input = document.getElementById('cmt-input');
var total = document.getElementById('cmt-n');

// 좋아요 토글 (이벤트 위임)
list.addEventListener('click', function (e) {
  var btn = e.target.closest('.like');
  if (!btn) return;
  var on = btn.getAttribute('aria-pressed') === 'true';
  var n = btn.querySelector('span');
  btn.setAttribute('aria-pressed', String(!on));
  n.textContent = Number(n.textContent) + (on ? -1 : 1);
});

form.addEventListener('submit', function (e) {
  e.preventDefault();
  var text = input.value.trim();
  if (!text) { input.focus(); return; }

  var li = document.createElement('li');
  li.className = 'cmt-item';
  li.innerHTML =
    '<span class="av" style="background:#e7e9e3">나</span>' +
    '<div class="cmt-body"><p class="cmt-meta"><b>나</b><time>방금</time></p>' +
    '<p class="cmt-text"></p>' +
    '<button class="like" type="button" aria-pressed="false">좋아요 <span>0</span></button></div>';
  li.querySelector('.cmt-text').textContent = text;  // XSS 방지
  list.appendChild(li);

  total.textContent = list.children.length;
  input.value = '';
});`});

E({id:'doner-menu', en:'Döner Menu', ko:'되너 메뉴', cat:'nav', h:440,
desc:'햄버거 메뉴의 변형으로, 위에서 아래로 갈수록 짧아지는 세 줄 아이콘입니다. 깔때기 모양처럼 보여 필터 묶음을 나타낼 때 씁니다.',
a11y:'아이콘 버튼에 aria-label="필터"를 붙이고 aria-expanded, aria-controls로 패널과 연결합니다. 필터를 적용한 결과는 aria-live 영역으로 알려 줍니다.',
html:`<div class="dn">
  <div class="dn-bar">
    <p><b>러닝화</b> <span id="dn-count">48개</span></p>
    <button class="dn-btn" type="button" aria-label="필터"
            aria-expanded="true" aria-controls="dn-panel">

  <div class="dn-panel" id="dn-panel">
    <fieldset>
      <legend>정렬</legend>
      <label><input type="radio" name="sort" value="추천순" checked> 추천순</label>
      <label><input type="radio" name="sort" value="최신순"> 최신순</label>
      <label><input type="radio" name="sort" value="낮은 가격순"> 낮은 가격순</label>

css:`body { align-items: flex-start; }
.dn { position: relative; width: min(100%, 420px); }
.dn-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid #d4d7d1;
}
.dn-bar p { margin: 0; font-size: 16px; }
.dn-bar span { color: #6b706c; font-size: 14px; }

/* 길이가 줄어드는 세 줄 */
.dn-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 11px 9px;
  border: 1px solid #d4d7d1;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
}
.dn-btn span { height: 2px; border-radius: 1px; background: #111312; }
.dn-btn span:nth-child(1) { width: 20px; }
.dn-btn span:nth-child(2) { width: 13px; }
.dn-btn span:nth-child(3) { width: 6px; }
.dn-btn[aria-expanded="true"] { background: #111312; }
.dn-btn[aria-expanded="true"] span { background: #fff; }
.dn-btn:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 2px; }

.dn-panel {
  display: grid;
  gap: 14px;
  margin-top: 12px;
  padding: 16px;
  border: 1px solid #d4d7d1;
  border-radius: 10px;
  background: #fafaf8;
}
.dn-panel fieldset { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; border: 0; }
.dn-panel legend { width: 100%; margin-bottom: 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: #4a4f4b; }
.dn-panel label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.dn-panel input { accent-color: #111312; width: 16px; height: 16px; }
.dn-apply {
  justify-self: start;
  padding: 8px 16px;
  border: 0;
  border-radius: 6px;
  background: #111312;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}
.dn-result { margin: 12px 0 0; font-size: 13px; color: #4a4f4b; }`,
js:`var btn = document.querySelector('.dn-btn');
var panel = document.getElementById('dn-panel');
var result = document.querySelector('.dn-result');
var count = document.getElementById('dn-count');

btn.addEventListener('click', function () {
  var open = panel.hidden;
  panel.hidden = !open;
  btn.setAttribute('aria-expanded', String(open));
});

document.querySelector('.dn-apply').addEventListener('click', function () {
  var sort = document.querySelector('input[name="sort"]:checked').value;
  var free = document.getElementById('dn-free').checked;
  var today = document.getElementById('dn-today').checked;
  var n = 48 - (free ? 17 : 0) - (today ? 21 : 0);
  var conds = [];
  if (free) conds.push('무료배송');
  if (today) conds.push('오늘 출발');

  count.textContent = n + '개';
  result.textContent = sort + ' · ' + (conds.length ? conds.join(', ') : '조건 없음');
  panel.hidden = true;
  btn.setAttribute('aria-expanded', 'false');
  btn.focus();
});`});

E({id:'dropdown', en:'Dropdown', ko:'드롭다운', cat:'input', h:400,
desc:'버튼을 누르면 목록이 아래로 펼쳐지고 그중 하나를 고르는 요소입니다. 선택지가 숨겨져 있어 호불호가 갈리는 요소이므로, 항목이 적다면 라디오 버튼이 더 나을 수 있습니다.',
a11y:'버튼에 aria-haspopup="listbox"와 aria-expanded를, 목록에 role="listbox"와 option을 줍니다. 방향키로 이동하고 Enter로 고르며 Esc로 닫습니다. 현재 항목은 aria-activedescendant로 알립니다.',
html:`<div class="dd">
  <span class="dd-label" id="dd-label">배송 국가</span>

  <button class="dd-btn" type="button" id="dd-btn"
          aria-haspopup="listbox" aria-expanded="false"
          aria-labelledby="dd-label dd-btn">
    <span id="dd-value">대한민국</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>

  <ul class="dd-list" role="listbox" tabindex="-1" aria-labelledby="dd-label" hidden>
    <li role="option" aria-selected="true">대한민국</li>
    <li role="option" aria-selected="false">일본</li>
    <li role="option" aria-selected="false">대만</li>
    <li role="option" aria-selected="false">싱가포르</li>
    <li role="option" aria-selected="false">독일</li>
    <li role="option" aria-selected="false">캐나다</li>
  </ul>
  <p class="dd-hint">방향키, Enter, Esc로도 조작할 수 있습니다.</p>
</div>`,
css:`body { align-items: flex-start; padding-top: 40px; }
.dd { position: relative; width: min(100%, 300px); }
.dd-label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }

.dd-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  height: 46px;
  padding: 0 14px;
  border: 1.5px solid #111312;
  border-radius: 8px;
  background: #fff;
  font-size: 15px;
  cursor: pointer;
}
.dd-btn svg { width: 18px; height: 18px; fill: none; stroke: #111312; stroke-width: 2; stroke-linecap: round; transition: transform .2s; }
.dd-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.dd-btn:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 2px; }

.dd-list {
  position: absolute;
  top: 80px; left: 0; right: 0;
  z-index: 2;
  max-height: 220px;
  overflow-y: auto;
  margin: 0;
  padding: 6px;
  list-style: none;
  background: #fff;
  border: 1px solid #d4d7d1;
  border-radius: 8px;
  box-shadow: 0 12px 28px rgba(17, 19, 18, .12);
}
.dd-list:focus { outline: none; }
.dd-list li {
  display: flex;
  justify-content: space-between;
  padding: 9px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.dd-list li.active { background: #f1f2ef; }
.dd-list li[aria-selected="true"] { font-weight: 600; }
.dd-list li[aria-selected="true"]::after { content: "✓"; }
.dd-hint { margin: 10px 0 0; font-size: 12.5px; color: #6b706c; }`,
js:`var btn = document.getElementById('dd-btn');
var list = document.querySelector('.dd-list');
var value = document.getElementById('dd-value');
var opts = Array.prototype.slice.call(list.children);
var active = 0;

opts.forEach(function (o, i) {
  o.id = 'dd-opt-' + i;
  o.addEventListener('click', function () { choose(i); });
  o.addEventListener('mousemove', function () { mark(i); });
});

function selectedIndex() {
  return opts.findIndex(function (o) { return o.getAttribute('aria-selected') === 'true'; });
}
function open() {
  list.hidden = false;
  btn.setAttribute('aria-expanded', 'true');
  mark(selectedIndex());
  list.focus();
}
function close(focusBtn) {
  list.hidden = true;
  btn.setAttribute('aria-expanded', 'false');
  if (focusBtn) btn.focus();
}
function mark(i) {
  active = i;
  opts.forEach(function (o, j) { o.classList.toggle('active', j === i); });
  list.setAttribute('aria-activedescendant', opts[i].id);
  opts[i].scrollIntoView({ block: 'nearest' });
}
function choose(i) {
  opts.forEach(function (o, j) { o.setAttribute('aria-selected', String(j === i)); });
  value.textContent = opts[i].textContent;
  close(true);
}

btn.addEventListener('click', function () { list.hidden ? open() : close(true); });

list.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); mark(Math.min(active + 1, opts.length - 1)); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); mark(Math.max(active - 1, 0)); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(active); }
  else if (e.key === 'Escape' || e.key === 'Tab') { close(e.key === 'Escape'); }
});

document.addEventListener('click', function (e) {
  if (!e.target.closest('.dd') && !list.hidden) close(false);
});`});

js:`var list = document.getElementById('fd-list');

];

  ['태오', '@taeo', '3시간', '토스트는 4초, 오류 토스트는 사용자가 닫을 때까지 남겨 두기로 했다.'],

function post(d, isNew) {

  var b = a.querySelector('b');
  b.id = id;
  b.textContent = d[0];

  a.querySelector('.txt').textContent = d[3];
  return a;
}

document.getElementById('fd-new').addEventListener('click', function () {
  newer.slice().reverse().forEach(function (d) { list.prepend(post(d, true)); });

});

document.getElementById('fd-more').addEventListener('click', function () {

});`});

E({id:'form', en:'Form', ko:'폼', cat:'input', h:600,

css:`body { align-items: flex-start; }
.fm { display: grid; gap: 14px; width: min(100%, 460px); }
.fm h3 { margin: 0 0 4px; font-size: 19px; }
.fm-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.fm-field { display: grid; gap: 6px; min-width: 0; }
.fm-zip { max-width: 180px; }
.fm label { font-size: 14px; font-weight: 600; }

.fm input,
.fm select {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  background: #fff;
  border: 1.5px solid #c9ccc6;
  border-radius: 8px;
  font-size: 15px;
}
.fm input:focus,
.fm select:focus { outline: none; border-color: #111312; box-shadow: 0 0 0 3px rgba(31, 63, 209, .2); }
.fm input[aria-invalid="true"] { border-color: #d42a1f; background: #fff7f6; }

.fm-err { min-height: 0; margin: 0; font-size: 13px; color: #c0241a; }
.fm-err:empty { display: none; }

.fm button {
  height: 48px;
  border: 0;
  border-radius: 8px;
  background: #111312;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.fm button:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 3px; }
.fm-done { margin: 0; font-size: 14px; color: #127a46; font-weight: 600; }`,
js:`var form = document.getElementById('fm');
var done = document.getElementById('fm-done');
var messages = {
  'f-name': '받는 분 이름을 입력해 주세요.',
  'f-tel':  '010-1234-5678 형식으로 입력해 주세요.',
  'f-zip':  '우편번호는 숫자 5자리입니다.',
  'f-addr': '도로명 주소를 입력해 주세요.'
};
var fields = Array.prototype.slice.call(form.querySelectorAll('[required]'));

fields.forEach(function (input) {
  input.setAttribute('aria-describedby', input.id + '-err');
  // 한 번 오류가 난 필드는 입력할 때마다 다시 확인
  input.addEventListener('input', function () {
    if (input.getAttribute('aria-invalid') === 'true') check(input);
  });
  input.addEventListener('blur', function () { if (input.value) check(input); });
});

function check(input) {
  var ok = input.checkValidity();
  input.setAttribute('aria-invalid', String(!ok));
  document.getElementById(input.id + '-err').textContent = ok ? '' : messages[input.id];
  return ok;
}

form.addEventListener('submit', function (e) {
  e.preventDefault();
  var firstBad = null;
  fields.forEach(function (input) {
    if (!check(input) && !firstBad) firstBad = input;
  });
  if (firstBad) {
    done.textContent = '';
    firstBad.focus();
    return;
  }
  done.textContent = '배송지를 저장했습니다.';
});`});

css:`body { display: block; padding: 0; }
.hb-app { position: relative; height: 100vh; overflow: hidden; background: #fff; }

.hb-btn {

}
.hb-btn[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hb-btn[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.hb-btn[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.hb-nav {
  position: absolute;
  top: 56px; bottom: 0; left: 0;
  z-index: 2;
  width: 240px;
  padding: 12px;

  transform: translateX(-100%);
  visibility: hidden;
  transition: transform .28s ease, visibility 0s linear .28s;
}
.hb-app.open .hb-nav { transform: none; visibility: visible; transition: transform .28s ease; }
.hb-nav ul { margin: 0; padding: 0; list-style: none; }
.hb-nav a {
  display: block;
  padding: 12px 14px;
  border-radius: 8px;
  color: #111312;
  font-size: 16px;
  text-decoration: none;
}
.hb-nav a:hover { background: #f1f2ef; }
.hb-nav a[aria-current="page"] { font-weight: 700; background: #ffe14d; }

.hb-scrim {
  position: absolute;
  inset: 56px 0 0;
  z-index: 1;
  background: rgba(17, 19, 18, .35);

.hb-app.open .hb-scrim { opacity: 1; pointer-events: auto; }

.hb-main { padding: 20px; }
.hb-main h2 { margin: 0 0 4px; font-size: 22px; }
.hb-main p { margin: 0 0 16px; color: #4a4f4b; }
.hb-ph { height: 90px; margin-bottom: 12px; border-radius: 10px; background: #f1f2ef; }
.hb-ph.short { width: 60%; height: 40px; }`,
js:`var app = document.querySelector('.hb-app');
var btn = document.querySelector('.hb-btn');

function setOpen(open) {
  app.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', String(open));
  btn.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
}

btn.addEventListener('click', function () {
  setOpen(!app.classList.contains('open'));
});
document.querySelector('.hb-scrim').addEventListener('click', function () { setOpen(false); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && app.classList.contains('open')) { setOpen(false); btn.focus(); }
});

document.querySelectorAll('.hb-nav a').forEach(function (a) {
  a.addEventListener('click', function (e) {
    e.preventDefault();
    document.querySelector('.hb-nav [aria-current]').removeAttribute('aria-current');
    a.setAttribute('aria-current', 'page');
    document.querySelector('.hb-main h2').textContent = a.textContent;
    setOpen(false);
  });
});`});

css:`.ic { --s: 24px; width: min(100%, 460px); }
.ic-tools { display: inline-flex; margin-bottom: 14px; border: 1px solid #d4d7d1; border-radius: 6px; overflow: hidden; }
.ic-tools button {
  padding: 5px 12px;
  border: 0;
  background: #fff;
  font: 500 12px ui-monospace, Menlo, monospace;
  cursor: pointer;
}
.ic-tools button + button { border-left: 1px solid #d4d7d1; }
.ic-tools button[aria-pressed="true"] { background: #111312; color: #fff; }

.ic-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 8px;
  margin: 0; padding: 0;
  list-style: none;
}
.ic-grid button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 16px 6px 10px;
  border: 1px solid #e3e5e0;
  border-radius: 8px;
  background: #fff;
  color: #111312;
  cursor: pointer;
}
.ic-grid button:hover { border-color: #111312; }
.ic-grid button:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 1px; }
.ic-grid svg {
  width: var(--s); height: var(--s);
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ic-grid span { font: 12px ui-monospace, Menlo, monospace; color: #4a4f4b; }
.ic-status { margin: 12px 0 0; font-size: 13px; color: #4a4f4b; }`,
js:`var root = document.querySelector('.ic');
var status = document.querySelector('.ic-status');

document.querySelectorAll('.ic-tools button').forEach(function (b) {
  b.addEventListener('click', function () {
    root.style.setProperty('--s', b.dataset.size + 'px');
    document.querySelectorAll('.ic-tools button').forEach(function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
  });
});

document.querySelectorAll('.ic-grid button').forEach(function (b) {
  b.addEventListener('click', function () {
    var name = b.querySelector('span').textContent;
    var done = function () { status.textContent = '‘' + name + '’ 이름을 복사했습니다.'; };
    var fail = function () { status.textContent = '선택한 아이콘: ' + name; };
    if (navigator.clipboard) navigator.clipboard.writeText(name).then(done, fail);
    else fail();
  });
});`});

E({id:'input-field', en:'Input Field', ko:'입력 필드', cat:'input', h:480,
desc:'사용자가 시스템에 내용을 입력하는 칸입니다. 폼 안에서만 쓰이는 것이 아니라 검색창도 입력 필드입니다. 라벨, 도움말, 오류, 글자 수 같은 상태를 함께 설계해야 합니다.',
a11y:'label의 for로 입력과 연결하고, 도움말과 오류 문장은 aria-describedby로 이어 둡니다. 오류일 때 aria-invalid를 켭니다. 비밀번호 보기 버튼은 aria-pressed로 상태를 알립니다.',
html:`<div class="tf">
  <div class="tf-field">
    <label for="tf-mail">이메일</label>
    <input id="tf-mail" type="email" value="hana@studio"
           placeholder="name@company.kr" aria-describedby="tf-mail-help">
    <p class="tf-help" id="tf-mail-help">로그인과 영수증 발송에 사용합니다.</p>
  </div>

  <div class="tf-field">
    <label for="tf-bio">한 줄 소개 <span class="tf-count" id="tf-count">0 / 60</span></label>
    <textarea id="tf-bio" rows="2" maxlength="60"
              aria-describedby="tf-count">인터페이스의 작은 상태를 좋아하는 프론트엔드 개발자</textarea>
  </div>

  <div class="tf-field">
    <label for="tf-pw">비밀번호</label>
    <div class="tf-pw">
      <input id="tf-pw" type="password" value="sample-pass" autocomplete="new-password">
      <button type="button" aria-pressed="false" aria-controls="tf-pw">보기</button>
    </div>
  </div>
</div>`,
css:`.tf { display: grid; gap: 18px; width: min(100%, 380px); }
.tf-field { display: grid; gap: 6px; }
.tf label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
.tf-count { font-weight: 400; font-size: 12.5px; color: #6b706c; font-variant-numeric: tabular-nums; }

.tf input,
.tf textarea {
  width: 100%;
  padding: 11px 12px;
  border: 1.5px solid #c9ccc6;
  border-radius: 8px;
  background: #fff;
  font-size: 15px;
  resize: vertical;
}
.tf input:hover,
.tf textarea:hover { border-color: #8d928b; }
.tf input:focus,
.tf textarea:focus { outline: none; border-color: #111312; box-shadow: 0 0 0 3px rgba(31, 63, 209, .2); }

.tf-help { margin: 0; font-size: 13px; color: #6b706c; }
.tf-field.error input { border-color: #d42a1f; background: #fff7f6; }
.tf-field.error .tf-help { color: #c0241a; }

.tf-pw { position: relative; }
.tf-pw input { padding-right: 64px; }
.tf-pw button {
  position: absolute;
  right: 6px; top: 50%;
  transform: translateY(-50%);
  padding: 5px 10px;
  border: 0;
  border-radius: 6px;
  background: #f1f2ef;
  font-size: 12.5px;
  cursor: pointer;
}
.tf-pw button:focus-visible { outline: 2px solid #1f3fd1; }`,
js:`var mail = document.getElementById('tf-mail');
var help = document.getElementById('tf-mail-help');
var defaultHelp = help.textContent;

function validateMail() {
  var bad = mail.value !== '' && !mail.validity.valid || (mail.value && mail.value.indexOf('.') < 0);
  mail.closest('.tf-field').classList.toggle('error', !!bad);
  mail.setAttribute('aria-invalid', String(!!bad));
  help.textContent = bad ? '이메일 형식이 아닙니다. @ 뒤에 도메인 전체(예: studio.kr)를 입력해 주세요.' : defaultHelp;
}
mail.addEventListener('input', validateMail);
validateMail();

var bio = document.getElementById('tf-bio');
var count = document.getElementById('tf-count');
function updateCount() { count.textContent = bio.value.length + ' / ' + bio.maxLength; }
bio.addEventListener('input', updateCount);
updateCount();

var pw = document.getElementById('tf-pw');
var toggle = document.querySelector('.tf-pw button');
toggle.addEventListener('click', function () {
  var show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  toggle.textContent = show ? '숨기기' : '보기';
  toggle.setAttribute('aria-pressed', String(show));
});`});

E({id:'kebab-menu', en:'Kebab Menu', ko:'케밥 메뉴', cat:'nav', h:400,
desc:'세로로 놓인 점 세 개 아이콘입니다. 목록의 각 행처럼 개별 항목에 딸린 옵션 묶음을 나타내며, 누르면 이름 바꾸기, 공유, 삭제 같은 동작이 나타납니다.',
a11y:'버튼에 aria-haspopup="menu"와 항목 이름이 들어간 aria-label을 줍니다. 메뉴는 role="menu", 항목은 role="menuitem"이며 열리면 첫 항목으로 포커스를 옮기고 방향키로 이동합니다.',
html:`<div class="kb">
  <h3>최근 파일</h3>
  <ul class="kb-list" id="kb-list">
    <li><span class="kb-type">PDF</span><span class="kb-name">2026_브랜드가이드.pdf</span><span class="kb-size">2.4 MB</span>
      <button class="kb-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="2026_브랜드가이드.pdf 옵션"><i></i><i></i><i></i></button></li>
    <li><span class="kb-type">DOC</span><span class="kb-name">사용자인터뷰_정리.docx</span><span class="kb-size">380 KB</span>
      <button class="kb-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="사용자인터뷰_정리.docx 옵션"><i></i><i></i><i></i></button></li>
    <li><span class="kb-type">IMG</span><span class="kb-name">대시보드_시안_v3.png</span><span class="kb-size">1.2 MB</span>
      <button class="kb-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="대시보드_시안_v3.png 옵션"><i></i><i></i><i></i></button></li>
  </ul>

  <ul class="kb-menu" id="kb-menu" role="menu" hidden>
    <li role="none"><button role="menuitem" type="button" data-act="rename">이름 바꾸기</button></li>
    <li role="none"><button role="menuitem" type="button" data-act="share">공유 링크 복사</button></li>
    <li role="none"><button role="menuitem" type="button" data-act="delete" class="danger">삭제</button></li>
  </ul>
  <p class="kb-status" aria-live="polite"></p>
</div>`,
css:`body { align-items: flex-start; }
.kb { position: relative; width: min(100%, 460px); }
.kb h3 { margin: 0 0 8px; font-size: 17px; }
.kb-list { margin: 0; padding: 0; list-style: none; border-top: 1px solid #d4d7d1; }
.kb-list li {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto 36px;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #e3e5e0;
}
.kb-type {
  padding: 3px 0;
  border: 1px solid #111312;
  border-radius: 4px;
  font: 600 10px ui-monospace, Menlo, monospace;
  text-align: center;
}
.kb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14.5px; }
.kb-size { font-size: 12.5px; color: #6b706c; font-variant-numeric: tabular-nums; }

/* 세로 점 세 개 */
.kb-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  width: 36px; height: 36px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
}
.kb-btn i { width: 4px; height: 4px; border-radius: 50%; background: #111312; }
.kb-btn:hover,
.kb-btn[aria-expanded="true"] { background: #f1f2ef; }
.kb-btn:focus-visible { outline: 2px solid #1f3fd1; }

.kb-menu {
  position: absolute;
  right: 0;
  z-index: 2;
  min-width: 160px;
  margin: 0;
  padding: 6px;
  list-style: none;
  background: #fff;
  border: 1px solid #d4d7d1;
  border-radius: 10px;
  box-shadow: 0 12px 28px rgba(17, 19, 18, .14);
}
.kb-menu button {
  width: 100%;
  padding: 9px 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
}
.kb-menu button:hover,
.kb-menu button:focus { outline: none; background: #f1f2ef; }
.kb-menu .danger { color: #c0241a; }
.kb-status { min-height: 1.5em; margin: 10px 0 0; font-size: 13px; color: #4a4f4b; }`,
js:`var menu = document.getElementById('kb-menu');
var status = document.querySelector('.kb-status');
var items = Array.prototype.slice.call(menu.querySelectorAll('[role="menuitem"]'));
var owner = null;

function openMenu(btn, focus) {
  if (owner) owner.setAttribute('aria-expanded', 'false');
  owner = btn;
  btn.setAttribute('aria-expanded', 'true');
  var row = btn.closest('li');
  menu.style.top = (row.offsetTop + row.offsetHeight - 6) + 'px';
  menu.hidden = false;
  if (focus) items[0].focus();
}
function closeMenu(focusOwner) {
  menu.hidden = true;
  if (owner) {
    owner.setAttribute('aria-expanded', 'false');
    if (focusOwner) owner.focus();
  }
  owner = null;
}

document.getElementById('kb-list').addEventListener('click', function (e) {
  var btn = e.target.closest('.kb-btn');
  if (!btn) return;
  e.stopPropagation();
  owner === btn ? closeMenu(true) : openMenu(btn, true);
});

menu.addEventListener('click', function (e) {
  var item = e.target.closest('[data-act]');
  if (!item || !owner) return;
  var row = owner.closest('li');
  var name = row.querySelector('.kb-name').textContent;
  var act = item.dataset.act;
  if (act === 'rename') status.textContent = '‘' + name + '’ 이름을 바꿀 수 있습니다.';
  if (act === 'share') status.textContent = '‘' + name + '’ 공유 링크를 복사했습니다.';
  if (act === 'delete') { status.textContent = '‘' + name + '’ 파일을 삭제했습니다.'; closeMenu(false); row.remove(); return; }
  closeMenu(true);
});

menu.addEventListener('keydown', function (e) {
  var i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  if (e.key === 'Escape') closeMenu(true);
});
document.addEventListener('click', function (e) { if (!menu.contains(e.target)) closeMenu(false); });

// 미리보기용: 첫 행의 메뉴를 열어 둔 상태로 시작
openMenu(document.querySelector('.kb-btn'), false);`});

E({id:'loader', en:'Loader', ko:'로더', cat:'info', h:420,
desc:'시스템이 뒤에서 작업을 처리하고 있으니 잠시 기다리라고 알려 주는 요소입니다. 형태가 매우 다양하며, 진행률을 알 수 있다면 확정형 바를, 알 수 없다면 회전형이나 스켈레톤을 씁니다.',
a11y:'회전형 로더에는 role="status"와 읽을 수 있는 텍스트를, 진행 바에는 role="progressbar"와 aria-valuenow를 줍니다. prefers-reduced-motion 설정에서는 회전 속도를 크게 늦춥니다.',
html:`<div class="ld">
  <figure>
    <div class="ld-ring" role="status"><span class="sr">불러오는 중</span></div>
    <figcaption>회전형</figcaption>
  </figure>

  <figure>
    <div class="ld-dots" role="status"><i></i><i></i><i></i><span class="sr">불러오는 중</span></div>

  </figure>

  <figure class="wide">
    <div class="ld-bar" role="progressbar" aria-label="업로드 진행률"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
    <figcaption>확정형 진행 바 <output id="ld-pct">0%</output></figcaption>
  </figure>

  <figure class="wide">

      <div><i></i><i class="s"></i></div>

css:`.ld {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  width: min(100%, 460px);
}
.ld figure {
  display: grid;
  place-items: center;
  gap: 14px;
  min-height: 110px;
  margin: 0;
  padding: 20px 16px 14px;
  border: 1px solid #e3e5e0;
  border-radius: 10px;
}
.ld .wide { grid-column: 1 / -1; place-items: stretch; }
.ld figcaption { display: flex; justify-content: space-between; font-size: 12.5px; color: #4a4f4b; }
.ld output { font: 600 12.5px ui-monospace, Menlo, monospace; color: #111312; }

.ld-ring {
  width: 34px; height: 34px;
  border: 3px solid #e3e5e0;
  border-top-color: #111312;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.ld-dots { display: flex; gap: 6px; }
.ld-dots i {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #111312;
  animation: bounce 1s ease-in-out infinite;
}
.ld-dots i:nth-child(2) { animation-delay: .15s; }
.ld-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-8px); opacity: 1; } }

.ld-bar { height: 8px; border-radius: 4px; background: #e3e5e0; overflow: hidden; }
.ld-bar span { display: block; height: 100%; width: 0; background: #1f3fd1; transition: width .2s linear; }

.ld-skel { display: flex; gap: 12px; align-items: center; }
.ld-skel div { flex: 1; display: grid; gap: 8px; }
.ld-skel i {
  display: block;
  height: 10px;
  border-radius: 5px;
  background: linear-gradient(90deg, #eceee9 0%, #f8f9f6 50%, #eceee9 100%) 0 0 / 200% 100%;
  animation: shimmer 1.3s linear infinite;
}
.ld-skel i.c { flex: none; width: 40px; height: 40px; border-radius: 50%; }
.ld-skel i.s { width: 60%; }
@keyframes shimmer { to { background-position: -200% 0; } }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (prefers-reduced-motion: reduce) {
  .ld-ring { animation-duration: 3s; }
  .ld-dots i, .ld-skel i { animation: none; }
}`,
js:`// 확정형 진행 바: 0 → 100%를 반복해서 보여 줍니다
var bar = document.querySelector('.ld-bar');
var fill = bar.querySelector('span');
var out = document.getElementById('ld-pct');
var pct = 0;

setInterval(function () {
  pct = pct >= 100 ? 0 : Math.min(100, pct + Math.round(Math.random() * 9 + 2));
  fill.style.width = pct + '%';
  bar.setAttribute('aria-valuenow', pct);
  out.textContent = pct + '%';
}, 260);`});

E({id:'meatballs-menu', en:'Meatballs Menu', ko:'미트볼 메뉴', cat:'nav', h:420,
desc:'가로로 놓인 점 세 개 아이콘으로, 더 많은 옵션이 숨어 있다는 표시입니다. 카드나 게시물의 오른쪽 위에 두고 누르면 고정하기, 링크 복사 같은 추가 동작이 나타납니다.',

  list-style: none;

.mb-menu button:focus { outline: none; background: #f1f2ef; }
.mb-menu [aria-checked="true"]::after { content: " ✓"; }
.mb-menu .danger { color: #c0241a; }`,
js:`var btn = document.querySelector('.mb-btn');
var menu = document.getElementById('mb-menu');
var status = document.querySelector('.mb-status');
var pin = document.getElementById('mb-pin');

function setOpen(open) {
  menu.hidden = !open;
  btn.setAttribute('aria-expanded', String(open));
  if (open) menu.querySelector('button').focus();
}

btn.addEventListener('click', function (e) {
  e.stopPropagation();
  setOpen(menu.hidden);
});

menu.addEventListener('click', function (e) {
  var item = e.target.closest('[data-act]');
  if (!item) return;
  var act = item.dataset.act;
  if (act === 'pin') {
    var on = item.getAttribute('aria-checked') !== 'true';
    item.setAttribute('aria-checked', String(on));
    pin.hidden = !on;
    status.textContent = on ? '글을 상단에 고정했습니다.' : '고정을 해제했습니다.';
  }
  if (act === 'copy') status.textContent = '링크를 복사했습니다.';
  if (act === 'mute') status.textContent = '이 글의 새 댓글 알림을 받지 않습니다.';
  if (act === 'report') status.textContent = '신고가 접수되었습니다. 검토 후 알려 드립니다.';
  setOpen(false);
  btn.focus();
});

document.addEventListener('click', function (e) {
  if (!menu.contains(e.target)) { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !menu.hidden) { setOpen(false); btn.focus(); }
});`});

E({id:'modal', en:'Modal', ko:'모달', cat:'box', h:400,
desc:'내용이나 메시지를 담은 작은 창으로, 사용자가 상호작용해야만 닫히고 원래 흐름으로 돌아갈 수 있습니다. 휴대폰에서 항목을 지울 때 뜨는 삭제 확인 창이 대표적인 예입니다.',
a11y:'네이티브 dialog 요소와 showModal()을 쓰면 포커스 가두기, 배경 비활성화, Esc 닫기가 기본으로 동작합니다. 제목과 본문은 aria-labelledby, aria-describedby로 연결합니다.',
html:`<div class="md-demo">
  <ul class="md-files">
    <li>
      <span>분기 보고서_최종.xlsx</span>
      <button class="md-open" type="button">삭제</button>
    </li>
  </ul>
  <p class="md-status" aria-live="polite">‘삭제’를 누르면 확인 모달이 열립니다.</p>
</div>

<dialog class="md" id="md" aria-labelledby="md-title" aria-describedby="md-desc">
  <form method="dialog">
    <h2 id="md-title">파일을 삭제할까요?</h2>
    <p id="md-desc">‘분기 보고서_최종.xlsx’는 휴지통에 30일 동안 보관된 뒤 완전히 지워집니다.</p>

</dialog>`,
css:`.md-demo { width: min(100%, 420px); }

  display: flex;
  justify-content: space-between;

}

.md {
  width: min(92vw, 360px);
  padding: 24px;

  box-shadow: 0 24px 60px rgba(17, 19, 18, .25);
}

@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }

.md h2 { margin: 0 0 8px; font-size: 19px; }
.md p { margin: 0 0 20px; font-size: 14.5px; color: #3a3f3c; }

  border: 0;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.md-ok { background: #d42a1f; color: #fff; }

.md-open:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 2px; }`,
js:`var dialog = document.getElementById('md');
var opener = document.querySelector('.md-open');
var status = document.querySelector('.md-status');

opener.addEventListener('click', function () {
  dialog.returnValue = '';
  dialog.showModal();
  dialog.querySelector('.md-cancel').focus();  // 위험한 동작은 '취소'에 기본 포커스
});

// 배경(backdrop)을 누르면 닫기
dialog.addEventListener('click', function (e) {
  if (e.target === dialog) dialog.close('cancel');
});

dialog.addEventListener('close', function () {
  if (dialog.returnValue === 'ok') {
    status.textContent = '파일을 휴지통으로 옮겼습니다.';
    opener.closest('li').style.opacity = '.4';
    opener.disabled = true;
  } else {
    status.textContent = '삭제를 취소했습니다.';
  }
  opener.focus();
});`});

js:`var badge = document.getElementById('nt-badge');
var bell = document.getElementById('nt-bell');
var toasts = document.getElementById('nt-toasts');
var unread = 3;

var copy = {
  msg: ['M', '지원 님이 메시지를 보냈습니다: “시안 확인 부탁드려요.”'],
  ok:  ['✓', '결제가 완료되었습니다. 영수증을 메일로 보냈습니다.'],
  err: ['!', '업로드에 실패했습니다. 파일이 20MB를 넘지 않는지 확인해 주세요.']
};

function setUnread(n) {
  unread = n;
  badge.textContent = n > 9 ? '9+' : n;
  badge.hidden = n === 0;
  bell.setAttribute('aria-label', n ? '알림 ' + n + '개' : '새 알림 없음');
}

function toast(kind) {
  var li = document.createElement('li');
  li.className = 'toast ' + kind;
  li.innerHTML = '<i aria-hidden="true"></i><span></span><button type="button" aria-label="알림 닫기">×</button>';
  li.querySelector('i').textContent = copy[kind][0];
  li.querySelector('span').textContent = copy[kind][1];
  li.querySelector('button').onclick = function () { li.remove(); };
  toasts.appendChild(li);
  // 오류는 사용자가 직접 닫을 때까지 유지
  if (kind !== 'err') setTimeout(function () { li.remove(); }, 4000);
}

document.querySelectorAll('[data-kind]').forEach(function (b) {
  b.addEventListener('click', function () {
    var kind = b.dataset.kind;
    if (kind === 'msg') {
      setUnread(unread + 1);
      bell.classList.remove('ring'); void bell.offsetWidth; bell.classList.add('ring');
    }
    toast(kind);
  });
});

bell.addEventListener('click', function () { setUnread(0); });`});

E({id:'pagination', en:'Pagination', ko:'페이지네이션', cat:'nav', h:300,
desc:'콘텐츠를 여러 페이지로 나누어 정리하는 요소로, 보통 페이지 아래쪽에 놓입니다. 지금 몇 번째 페이지에 있는지 알려 주고, 눌러서 다른 페이지로 이동하게 합니다.',
a11y:'nav에 aria-label을 붙이고 현재 페이지 버튼에 aria-current="page"를 줍니다. 숫자 버튼은 "7페이지"처럼 읽히게 aria-label을 달고, 생략 부호 "…"는 aria-hidden으로 숨깁니다.',
html:`<div class="pg-demo">
  <p class="pg-info" id="pg-info" aria-live="polite"></p>
  <nav class="pg" aria-label="검색 결과 페이지">

</div>`,
css:`.pg-demo { display: grid; justify-items: center; gap: 16px; width: 100%; }
.pg-info { margin: 0; font-size: 14px; color: #4a4f4b; font-variant-numeric: tabular-nums; }

.pg ul {

  align-items: center;
  gap: 4px;
  margin: 0; padding: 0;

}
.pg button {
  min-width: 38px;
  height: 38px;
  padding: 0 10px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  font-size: 14.5px;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.pg button:hover:not(:disabled) { background: #f1f2ef; }
.pg button:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 1px; }
.pg button[aria-current="page"] { background: #111312; color: #fff; font-weight: 700; }
.pg .prev,
.pg .next { border-color: #d4d7d1; }
.pg button:disabled { color: #b0b5ae; cursor: not-allowed; }
.pg .gap { min-width: 24px; text-align: center; color: #8d928b; }`,
js:`var total = 24, current = 7, results = 237, perPage = 10;
var ul = document.getElementById('pg');
var info = document.getElementById('pg-info');

// 1 … 6 7 8 … 24 형태의 페이지 배열 만들기
function pages() {
  var out = [1];
  var start = Math.max(2, current - 1);
  var end = Math.min(total - 1, current + 1);
  if (current <= 3) { start = 2; end = 4; }
  if (current >= total - 2) { start = total - 3; end = total - 1; }
  if (start > 2) out.push('…');
  for (var p = start; p <= end; p++) out.push(p);
  if (end < total - 1) out.push('…');
  out.push(total);
  return out;
}

function addButton(label, target, disabled, cls) {
  var li = document.createElement('li');
  var b = document.createElement('button');
  b.type = 'button';
  b.textContent = label;
  if (cls) b.className = cls;
  b.disabled = disabled;
  if (typeof label === 'number') b.setAttribute('aria-label', label + '페이지');
  if (label === current) b.setAttribute('aria-current', 'page');
  b.addEventListener('click', function () { current = target; render(); ul.querySelector('[aria-current]').focus(); });
  li.appendChild(b);
  ul.appendChild(li);
}

function render() {
  ul.innerHTML = '';
  addButton('이전', current - 1, current === 1, 'prev');
  pages().forEach(function (p) {
    if (p === '…') {
      var li = document.createElement('li');
      li.className = 'gap';
      li.setAttribute('aria-hidden', 'true');
      li.textContent = '…';
      ul.appendChild(li);
    } else {
      addButton(p, p, false, '');
    }
  });
  addButton('다음', current + 1, current === total, 'next');

  var from = (current - 1) * perPage + 1;
  var to = Math.min(current * perPage, results);
  info.textContent = '검색 결과 ' + results + '건 중 ' + from + '–' + to + '번째';
}
render();`});

desc:'날짜와 시간을 고르게 하는 요소입니다. 직접 입력하는 필드보다 형식이 일정하게 유지되므로, 입력한 데이터를 깔끔하게 저장하고 다루기 쉽다는 장점이 있습니다.',

html:`<div class="pk">

  background: #fff;
  font: 500 13.5px ui-monospace, Menlo, monospace;

.pk-slots button:disabled { color: #b0b5ae; text-decoration: line-through; cursor: not-allowed; }

.pk-out {
  flex-basis: 100%;

js:`var DAYS = ['일', '월', '화', '수', '목', '금', '토'];
var SLOTS = ['10:00', '11:30', '14:00', '15:30', '17:00', '18:30'];
var FULL = ['11:30'];                          // 마감된 시간

var today = new Date(); today.setHours(0, 0, 0, 0);
var view = new Date(today.getFullYear(), today.getMonth(), 1);
var picked = new Date(today); picked.setDate(today.getDate() + 3);
var time = '14:00';

function renderCalendar() {
  var y = view.getFullYear(), m = view.getMonth();
  document.getElementById('pk-month').textContent = y + '년 ' + (m + 1) + '월';
  var grid = document.getElementById('pk-grid');
  grid.innerHTML = '';
  var firstDay = new Date(y, m, 1).getDay();
  var length = new Date(y, m + 1, 0).getDate();
  for (var i = 0; i < firstDay; i++) grid.appendChild(document.createElement('span'));

  for (var d = 1; d <= length; d++) {
    (function (date) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = date.getDate();
      b.setAttribute('aria-label', (m + 1) + '월 ' + date.getDate() + '일 ' + DAYS[date.getDay()] + '요일');
      if (date < today) b.disabled = true;
      if (date.getDay() === 0) b.classList.add('sun');
      if (+date === +today) b.classList.add('today');
      b.setAttribute('aria-pressed', String(+date === +picked));
      b.addEventListener('click', function () { picked = date; renderCalendar(); });
      grid.appendChild(b);
    })(new Date(y, m, d));
  }
  // 이번 달보다 이전으로는 이동하지 않음
  document.getElementById('pk-prev').disabled = y === today.getFullYear() && m === today.getMonth();
  renderOutput();
}

function renderSlots() {
  var box = document.getElementById('pk-slots');
  box.innerHTML = '';
  SLOTS.forEach(function (t) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = t;
    b.disabled = FULL.indexOf(t) > -1;
    if (b.disabled) b.setAttribute('aria-label', t + ' 마감');
    b.setAttribute('aria-pressed', String(t === time));
    b.addEventListener('click', function () { time = t; renderSlots(); renderOutput(); });
    box.appendChild(b);
  });
}

function renderOutput() {
  document.getElementById('pk-out').textContent =
    '예약: ' + picked.getFullYear() + '년 ' + (picked.getMonth() + 1) + '월 ' +
    picked.getDate() + '일 (' + DAYS[picked.getDay()] + ') ' + time;
}

document.getElementById('pk-prev').onclick = function () { view.setMonth(view.getMonth() - 1); renderCalendar(); };
document.getElementById('pk-next').onclick = function () { view.setMonth(view.getMonth() + 1); renderCalendar(); };
renderCalendar();
renderSlots();`});

E({id:'progress-bar', en:'Progress Bar', ko:'진행 표시줄', cat:'info', h:360,
desc:'여러 단계 중 지금 어디까지 왔는지 시각적으로 보여 주는 요소입니다. 결제 화면에서 장바구니, 배송 정보, 결제처럼 구매를 마치기 위해 거쳐야 하는 단계를 표시할 때 자주 씁니다.',
a11y:'막대에 role="progressbar"를 주고 aria-valuenow와 함께 aria-valuetext로 "4단계 중 2단계: 배송 정보"처럼 단계 이름을 읽어 줍니다. 단계 목록의 현재 항목에는 aria-current="step"을 씁니다.',
html:`<div class="pb">
  <ol class="pb-steps" id="pb-steps">
    <li>장바구니</li>
    <li>배송 정보</li>
    <li>결제</li>
    <li>주문 완료</li>
  </ol>

  <div class="pb-track" id="pb-track" role="progressbar" aria-label="주문 진행 단계"
       aria-valuemin="1" aria-valuemax="4" aria-valuenow="2">
    <span id="pb-fill"></span>
  </div>

  <p class="pb-text" id="pb-text"></p>

  <div class="pb-nav">
    <button type="button" id="pb-prev">이전</button>
    <button type="button" id="pb-next" class="pri">다음 단계</button>
  </div>
</div>`,
css:`.pb { display: grid; gap: 14px; width: min(100%, 480px); }

.pb-steps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin: 0; padding: 0;
  list-style: none;
  counter-reset: step;
}
.pb-steps li {
  counter-increment: step;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  color: #8d928b;
}
.pb-steps li::before {
  content: counter(step);
  display: grid;
  place-items: center;
  width: 26px; height: 26px;
  border: 1.5px solid #c9ccc6;
  border-radius: 50%;
  background: #fff;
  font: 600 12px ui-monospace, Menlo, monospace;
}
.pb-steps li.done { color: #111312; }
.pb-steps li.done::before { content: "✓"; background: #111312; border-color: #111312; color: #fff; }
.pb-steps li[aria-current="step"] { color: #111312; font-weight: 700; }
.pb-steps li[aria-current="step"]::before { border-color: #111312; background: #ffe14d; color: #111312; }

.pb-track { height: 6px; border-radius: 3px; background: #e3e5e0; overflow: hidden; }
.pb-track span { display: block; height: 100%; background: #111312; transition: width .35s ease; }

.pb-text { margin: 0; font-size: 14.5px; color: #3a3f3c; }
.pb-nav { display: flex; justify-content: space-between; }
.pb-nav button {
  padding: 9px 18px;
  border: 1px solid #c9ccc6;
  border-radius: 8px;
  background: #fff;
  font-size: 14.5px;
  font-weight: 600;
  cursor: pointer;
}
.pb-nav .pri { background: #111312; border-color: #111312; color: #fff; }
.pb-nav button:disabled { opacity: .4; cursor: not-allowed; }
.pb-nav button:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 2px; }`,
js:`var steps = Array.prototype.slice.call(document.querySelectorAll('#pb-steps li'));
var track = document.getElementById('pb-track');
var fill = document.getElementById('pb-fill');
var text = document.getElementById('pb-text');
var prev = document.getElementById('pb-prev');
var next = document.getElementById('pb-next');
var notes = [
  '담은 상품 3개, 합계 42,000원을 확인하세요.',
  '받는 분과 주소를 입력하는 단계입니다.',
  '결제 수단을 고르고 결제를 진행합니다.',
  '주문이 접수되었습니다. 주문 번호 20261003-0417.'
];
var current = 2;

function render() {
  steps.forEach(function (li, i) {
    li.classList.toggle('done', i < current - 1);
    if (i === current - 1) li.setAttribute('aria-current', 'step');
    else li.removeAttribute('aria-current');
  });
  fill.style.width = ((current - 1) / (steps.length - 1)) * 100 + '%';
  track.setAttribute('aria-valuenow', current);
  track.setAttribute('aria-valuetext', steps.length + '단계 중 ' + current + '단계: ' + steps[current - 1].textContent);
  text.textContent = notes[current - 1];
  prev.disabled = current === 1;
  next.disabled = current === steps.length;
  next.textContent = current === steps.length - 1 ? '결제하기' : '다음 단계';
}

prev.addEventListener('click', function () { current--; render(); });
next.addEventListener('click', function () { current++; render(); });
render();`});

html:`<div class="sf" role="search">

css:`body { align-items: flex-start; padding-top: 40px; }

}
.sf-list li.active,
.sf-list li:hover { background: #f1f2ef; }
.sf-list small { color: #6b706c; font-size: 12.5px; }
.sf-list mark { background: #ffe14d; color: inherit; padding: 0 1px; }
.sf-meta { margin: 8px 4px 0; font-size: 13px; color: #6b706c; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }`,
js:`var CITIES = [
  ['서울', '특별시'], ['부산', '광역시'], ['대구', '광역시'], ['인천', '광역시'],
  ['광주', '광역시'], ['대전', '광역시'], ['울산', '광역시'], ['세종', '특별자치시'],
  ['수원', '경기'], ['부천', '경기'], ['전주', '전북'], ['경주', '경북'],
  ['강릉', '강원'], ['춘천', '강원'], ['여수', '전남'], ['제주', '제주']
];
var input = document.getElementById('sf-input');
var list = document.getElementById('sf-list');
var meta = document.getElementById('sf-meta');
var clear = document.querySelector('.sf-clear');
var matches = [], active = -1;

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
}

function render() {
  var q = input.value.trim();
  clear.hidden = !q;
  list.innerHTML = '';
  active = -1;
  input.removeAttribute('aria-activedescendant');
  matches = q ? CITIES.filter(function (c) { return c[0].indexOf(q) > -1; }) : [];

  matches.forEach(function (c, i) {
    var li = document.createElement('li');
    li.id = 'sf-opt-' + i;
    li.setAttribute('role', 'option');
    li.innerHTML = '<span>' + escapeHtml(c[0]).replace(escapeHtml(q), '<mark>' + escapeHtml(q) + '</mark>') +
                   '</span><small>' + c[1] + '</small>';
    li.addEventListener('click', function () { pick(i); });
    list.appendChild(li);
  });
  input.setAttribute('aria-expanded', String(matches.length > 0));
  meta.textContent = !q ? '전국 16개 도시에서 찾습니다.'
    : matches.length ? '추천 도시 ' + matches.length + '곳'
    : '‘' + q + '’와 일치하는 도시가 없습니다. 철자를 확인해 주세요.';
}

function mark(i) {
  var items = list.children;
  if (!items.length) return;
  active = (i + items.length) % items.length;
  Array.prototype.forEach.call(items, function (li, j) { li.classList.toggle('active', j === active); });
  input.setAttribute('aria-activedescendant', items[active].id);
}

function pick(i) {
  input.value = matches[i][0];
  render();
  meta.textContent = '‘' + input.value + '’ 검색 결과로 이동합니다.';
  list.innerHTML = '';
  input.setAttribute('aria-expanded', 'false');
}

input.addEventListener('input', render);
input.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); mark(active + 1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); mark(active - 1); }
  if (e.key === 'Enter' && active > -1) { e.preventDefault(); pick(active); }
  if (e.key === 'Escape') { input.value = ''; render(); }
});
clear.addEventListener('click', function () { input.value = ''; render(); input.focus(); });
render();`});

js:`// 단일 슬라이더
var vol = document.getElementById('sl-vol');
var volOut = document.getElementById('sl-vol-out');
function updateVol() {
  vol.style.setProperty('--p', vol.value + '%');
  volOut.textContent = vol.value;
}
vol.addEventListener('input', updateVol);
updateVol();

// 범위 슬라이더
var min = document.getElementById('sl-min');
var max = document.getElementById('sl-max');
var fill = document.getElementById('sl-fill');
var out = document.getElementById('sl-price-out');
var STEP = 5000, MAX = 200000;

function won(v) { return v === 0 ? '0' : (v / 10000) + '만'; }

function updateRange(e) {
  var a = Number(min.value), b = Number(max.value);
  // 두 손잡이가 겹치지 않게 최소 간격 유지
  if (a > b - STEP) {
    if (e && e.target === min) { a = b - STEP; min.value = a; }
    else { b = a + STEP; max.value = b; }
  }
  fill.style.left = (a / MAX) * 100 + '%';
  fill.style.right = (100 - (b / MAX) * 100) + '%';
  out.textContent = won(a) + ' – ' + won(b) + ' 원';
  min.setAttribute('aria-valuetext', won(a) + '원');
  max.setAttribute('aria-valuetext', won(b) + '원');
}
min.addEventListener('input', updateRange);
max.addEventListener('input', updateRange);
updateRange();`});

js:`var ctrls = Array.prototype.slice.call(document.querySelectorAll('.st-ctrl'));
var total = document.querySelector('.st-total');

function refresh() {
  var people = 0, sum = 0;
  ctrls.forEach(function (c) {
    var v = Number(c.querySelector('output').textContent);
    c.querySelector('.st-dec').disabled = v <= Number(c.dataset.min);
    c.querySelector('.st-inc').disabled = v >= Number(c.dataset.max);
    people += v;
    sum += v * Number(c.dataset.price);
  });
  total.innerHTML = '총 ' + people + '명 · <b>' + sum.toLocaleString('ko-KR') + '원</b>';
}

ctrls.forEach(function (c) {
  var out = c.querySelector('output');
  function step(delta) {
    var v = Number(out.textContent) + delta;
    v = Math.max(Number(c.dataset.min), Math.min(Number(c.dataset.max), v));
    out.textContent = v;
    refresh();
  }
  c.querySelector('.st-dec').addEventListener('click', function () { step(-1); });
  c.querySelector('.st-inc').addEventListener('click', function () { step(1); });
});
refresh();`});

js:`var tags = ['인터랙션', 'CSS', '사용성 테스트'];
var MAX = 6;
var list = document.getElementById('tg-list');
var input = document.getElementById('tg-input');
var status = document.querySelector('.tg-status');
var suggests = document.querySelectorAll('.tg-suggest button');

function render() {
  list.innerHTML = '';
  tags.forEach(function (t, i) {
    var li = document.createElement('li');
    var label = document.createElement('span');
    label.textContent = t;
    var x = document.createElement('button');
    x.type = 'button';
    x.textContent = '×';
    x.setAttribute('aria-label', t + ' 태그 삭제');
    x.addEventListener('click', function () { remove(i); input.focus(); });
    li.append(label, x);
    list.appendChild(li);
  });
  suggests.forEach(function (b) {
    b.disabled = tags.indexOf(b.textContent) > -1 || tags.length >= MAX;
  });
  input.disabled = tags.length >= MAX;
  input.placeholder = tags.length >= MAX ? '태그는 6개까지입니다' : '입력 후 Enter';
}

function add(text) {
  text = text.trim().replace(/^#/, '');
  if (!text || tags.indexOf(text) > -1 || tags.length >= MAX) return;
  tags.push(text);
  status.textContent = text + ' 태그를 추가했습니다.';
  render();
}
function remove(i) {
  status.textContent = tags[i] + ' 태그를 삭제했습니다.';
  tags.splice(i, 1);
  render();
}

input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); add(input.value); input.value = ''; }
  if (e.key === 'Backspace' && !input.value && tags.length) remove(tags.length - 1);
});
suggests.forEach(function (b) { b.addEventListener('click', function () { add(b.textContent); }); });
render();`});

document.querySelectorAll('.tabbar button').forEach(function (btn) {

css:`.tt-demo { display: grid; justify-items: center; gap: 40px; padding-top: 30px; }
.tt-field { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }

.tt { position: relative; display: inline-flex; }
.tt-ico {

}

.tt [role="tooltip"] {
  position: absolute;
  bottom: calc(100% + 10px);
  left: 50%;
  z-index: 2;
  width: max-content;
  max-width: 240px;
  padding: 8px 10px;
  border-radius: 6px;
  background: #111312;

/* 꼬리 */

  top: 100%; left: 50%;
  margin-left: -5px;
  border: 5px solid transparent;

}
.tt-bottom [role="tooltip"] { top: calc(100% + 10px); bottom: auto; transform: translate(-50%, -4px); }

.tt:hover [role="tooltip"],
.tt:focus-within [role="tooltip"] { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
.tt.dismissed [role="tooltip"] { opacity: 0; visibility: hidden; }

.tt kbd {
  padding: 0 4px;

.tt button:focus-visible { outline: 2px solid #1f3fd1; outline-offset: 2px; }
